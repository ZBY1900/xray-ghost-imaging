name: render
on:
  push:
    paths: ["data/papers.yaml", "scripts/render.py"]
  pull_request:
    paths: ["data/papers.yaml"]
jobs:
  render:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install pyyaml
      - run: python scripts/render.py
      - name: Fail if generated files are stale
        run: git diff --exit-code -- README.md bib/ docs/ || { echo "::error::README/docs out of date, run scripts/render.py locally"; exit 1; }
      - name: Commit back (branches only)
        if: github.event_name == 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A && git commit -m "chore: regenerate from papers.yaml" || exit 0
          git push